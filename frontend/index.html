<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFR Timing</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --carbon:   #0e1116;
    --surface:  #161b22;
    --surface2: #1c222b;
    --line:     #262d38;
    --line2:    #313a47;
    --text:     #e6eaef;
    --muted:    #8a93a0;
    --muted2:   #5d6672;
    --amber:    #ff7a18;
    --amber-dim:#3a2410;
    --mint:     #34d399;
    --sky:      #38bdf8;
    --red:      #f05151;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background:
      radial-gradient(1200px 600px at 70% -10%, rgba(255,122,24,0.05), transparent 60%),
      var(--carbon);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }

  /* ───────── COMMAND BAR ───────── */
  .cmdbar {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--line);
    background: rgba(22,27,34,0.6);
    backdrop-filter: blur(8px);
  }

  .brand {
    font-family: 'Saira Condensed', sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .brand b { color: var(--amber); font-weight: 700; }

  .mode-seg {
    display: flex;
    border: 1px solid var(--line2);
    border-radius: 8px;
    overflow: hidden;
  }
  .mode-seg button {
    font-family: 'Saira Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 8px 22px;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .mode-seg button.active { background: var(--text); color: var(--carbon); }
  .mode-seg button:not(.active):hover { color: var(--text); background: var(--surface2); }

  .cmd-spacer { flex: 1; }

  .conn {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--muted);
    font-weight: 500;
  }
  .conn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted2); transition: all 0.3s; }
  .conn .dot.on { background: var(--mint); box-shadow: 0 0 8px var(--mint); }

  .ghost-btn {
    font-family: 'Saira Condensed', sans-serif;
    font-size: 13px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 7px 14px;
    background: transparent;
    border: 1px solid var(--line2);
    color: var(--muted);
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .ghost-btn:hover { color: var(--text); border-color: var(--muted); }
  .ghost-btn.danger:hover { color: var(--red); border-color: var(--red); }

  /* ───────── DRIVER STRIP ───────── */
  .driver-strip {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    flex-wrap: wrap;
  }
  .strip-label {
    font-family: 'Saira Condensed', sans-serif;
    font-size: 13px; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted2);
  }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; }

  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 12px;
    border: 1px solid var(--line2);
    border-radius: 999px;
    background: var(--surface2);
    color: var(--muted);
    font-size: 14px; font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .chip:hover { border-color: var(--muted); color: var(--text); }
  .chip.active {
    border-color: var(--amber);
    color: var(--amber);
    background: var(--amber-dim);
  }
  .chip .x {
    color: var(--muted2);
    font-size: 13px; line-height: 1;
    transition: color 0.15s;
  }
  .chip .x:hover { color: var(--red); }
  .chip-empty { color: var(--muted2); font-size: 13px; font-style: italic; }

  .add-driver { display: flex; gap: 6px; }
  .add-driver input {
    background: var(--carbon);
    border: 1px solid var(--line2);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 7px 12px;
    border-radius: 7px;
    outline: none;
    width: 130px;
    transition: border-color 0.15s;
  }
  .add-driver input:focus { border-color: var(--amber); }
  .add-driver input::placeholder { color: var(--muted2); }
  .add-driver button {
    width: 34px;
    border: 1px solid var(--line2);
    background: transparent;
    color: var(--muted);
    font-size: 18px;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .add-driver button:hover { color: var(--amber); border-color: var(--amber); }

  .arm-btn {
    font-family: 'Saira Condensed', sans-serif;
    font-size: 17px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
    padding: 11px 38px;
    border-radius: 9px;
    border: 1.5px solid var(--mint);
    background: rgba(52,211,153,0.08);
    color: var(--mint);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .arm-btn:hover { background: rgba(52,211,153,0.16); }
  .arm-btn.armed {
    border-color: var(--amber);
    color: var(--amber);
    background: var(--amber-dim);
    animation: armpulse 1.6s ease-in-out infinite;
  }
  .arm-btn.armed:hover { border-color: var(--red); color: var(--red); background: rgba(240,81,81,0.1); animation: none; }
  @keyframes armpulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,122,24,0.0);} 50% { box-shadow: 0 0 0 4px rgba(255,122,24,0.10);} }

  /* ───────── HERO TIMER ───────── */
  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 36px 24px 26px;
    border-bottom: 1px solid var(--line);
    position: relative;
  }
  .hero-state {
    font-family: 'Saira Condensed', sans-serif;
    font-size: 13px; font-weight: 600;
    letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--muted2);
    margin-bottom: 8px;
  }
  .hero-state.live { color: var(--amber); }
  .timer {
    font-family: 'JetBrains Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: clamp(56px, 11vw, 128px);
    line-height: 0.95;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  .timer.idle { color: var(--muted2); }
  .timer.live { color: var(--amber); }

  .hero-stats {
    display: flex;
    gap: 0;
    margin-top: 24px;
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  .hstat {
    padding: 14px 30px;
    text-align: center;
    border-right: 1px solid var(--line);
    min-width: 120px;
  }
  .hstat:last-child { border-right: none; }
  .hstat .v {
    font-family: 'JetBrains Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 24px; font-weight: 500;
    color: var(--text);
  }
  .hstat.best .v { color: var(--mint); }
  .hstat .l {
    font-family: 'Saira Condensed', sans-serif;
    font-size: 12px; font-weight: 600;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted2);
    margin-top: 4px;
  }

  /* ───────── BODY: leaderboard + log ───────── */
  .body {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(280px, 1fr) minmax(320px, 1.4fr);
    min-height: 0;
  }

  .panel { display: flex; flex-direction: column; min-height: 0; }
  .panel.left { border-right: 1px solid var(--line); }

  .panel-head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 16px 22px 12px;
  }
  .panel-title {
    font-family: 'Saira Condensed', sans-serif;
    font-size: 16px; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase;
  }
  .panel-sub { font-size: 12px; color: var(--muted2); }

  .panel-scroll { overflow-y: auto; padding: 0 14px 18px; }

  /* leaderboard rows */
  .lb-row {
    display: grid;
    grid-template-columns: 34px 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 12px 12px;
    border-radius: 10px;
    transition: background 0.15s;
  }
  .lb-row:hover { background: var(--surface); }
  .lb-rank {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px; font-weight: 700;
    color: var(--muted2);
    text-align: center;
  }
  .lb-row.p1 .lb-rank { color: var(--amber); }
  .lb-name { font-size: 16px; font-weight: 500; }
  .lb-row.p1 .lb-name { color: var(--text); }
  .lb-meta { font-size: 12px; color: var(--muted2); }
  .lb-time {
    font-family: 'JetBrains Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 18px; font-weight: 500;
    color: var(--text);
  }
  .lb-row.p1 .lb-time { color: var(--mint); }

  /* log rows */
  .log-row {
    display: grid;
    grid-template-columns: 44px 1fr auto auto;
    align-items: center;
    gap: 14px;
    padding: 11px 12px;
    border-bottom: 1px solid var(--line);
    transition: background 0.15s;
  }
  .log-row:hover { background: var(--surface); }
  .log-row.fresh { animation: freshrow 0.7s ease-out; }
  @keyframes freshrow { 0% { background: rgba(255,122,24,0.14);} 100% { background: transparent;} }
  .log-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px; color: var(--muted2);
  }
  .log-driver { font-size: 15px; color: var(--muted); }
  .log-time {
    font-family: 'JetBrains Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 17px; font-weight: 500;
    color: var(--text);
    text-align: right;
  }
  .log-time.best { color: var(--mint); }
  .log-delta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    text-align: right;
    min-width: 64px;
    color: var(--muted2);
  }
  .log-delta.pos { color: var(--red); }
  .log-delta.neg { color: var(--mint); }

  .empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--muted2);
    font-size: 14px;
  }

  /* flash */
  .flash {
    position: fixed; inset: 0;
    background: rgba(255,122,24,0.05);
    opacity: 0; pointer-events: none;
    transition: opacity 0.06s;
    z-index: 50;
  }
  .flash.on { opacity: 1; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 860px) {
    .body { grid-template-columns: 1fr; }
    .panel.left { border-right: none; border-bottom: 1px solid var(--line); }
    .hero-stats { flex-wrap: wrap; }
    .hstat { flex: 1; min-width: 90px; }
    .cmdbar { flex-wrap: wrap; gap: 12px; }
  }
</style>
</head>
<body>

<div class="flash" id="flash"></div>

<!-- COMMAND BAR -->
<div class="cmdbar">
  <div class="brand">CFR <b>Timing</b></div>
  <div class="mode-seg">
    <button id="modeLap"   class="active" onclick="setMode('lap')">Lap</button>
    <button id="modeAccel"            onclick="setMode('accel')">Accel</button>
  </div>
  <div class="cmd-spacer"></div>
  <div class="conn"><span class="dot" id="connDot"></span><span id="connText">connecting</span></div>
  <button class="ghost-btn" onclick="exportCSV()">Export</button>
  <button class="ghost-btn danger" onclick="resetSession()">Reset</button>
</div>

<!-- DRIVER STRIP -->
<div class="driver-strip">
  <span class="strip-label">Drivers</span>
  <div class="chips" id="chips"><span class="chip-empty">none yet — laps log as Unassigned</span></div>
  <div class="add-driver">
    <input id="driverInput" placeholder="add driver" onkeydown="if(event.key==='Enter')addDriver()">
    <button onclick="addDriver()">+</button>
  </div>
  <button class="arm-btn" id="armBtn" onclick="toggleArm()">Arm</button>
</div>

<!-- HERO -->
<div class="hero">
  <div class="hero-state" id="heroState">waiting for first trigger</div>
  <div class="timer idle mono" id="timer">0:00.000</div>
  <div class="hero-stats">
    <div class="hstat best"><div class="v mono" id="sBest">—</div><div class="l">Best</div></div>
    <div class="hstat"><div class="v mono" id="sLast">—</div><div class="l">Last</div></div>
    <div class="hstat"><div class="v mono" id="sAvg">—</div><div class="l">Average</div></div>
    <div class="hstat"><div class="v mono" id="sCount">0</div><div class="l" id="sCountLabel">Laps</div></div>
  </div>
</div>

<!-- BODY -->
<div class="body">
  <div class="panel left">
    <div class="panel-head">
      <span class="panel-title">Leaderboard</span>
      <span class="panel-sub">best per driver</span>
    </div>
    <div class="panel-scroll" id="leaderboard">
      <div class="empty">No times yet.</div>
    </div>
  </div>
  <div class="panel">
    <div class="panel-head">
      <span class="panel-title" id="logTitle">Lap Log</span>
      <span class="panel-sub" id="logSub">every lap, newest first</span>
    </div>
    <div class="panel-scroll" id="log">
      <div class="empty">Arm the sensor and send the car.</div>
    </div>
  </div>
</div>

<script>
  const socket = io();
  let armed = false, mode = 'lap';
  let entries = [], drivers = [], activeDriver = null;
  let liveStart = null, liveTimer = null;

  socket.on('connect',    () => setConn(true));
  socket.on('disconnect', () => setConn(false));

  socket.on('event', (e) => {
    switch (e.type) {
      case 'armed':    armed = true;  updateArm(); break;
      case 'disarmed': armed = false; updateArm(); stopLive(); setTimer('0:00.000','idle','waiting for first trigger'); break;
      case 'mode_changed': mode = e.mode; refresh(); break;
      case 'reset': entries = []; stopLive(); setTimer('0:00.000','idle','waiting for first trigger'); renderAll(); break;
      case 'drivers_changed': drivers = e.drivers; activeDriver = e.active_driver; renderChips(); break;
      case 'lap_started':
      case 'run_started': liveStart = Date.now(); startLive(); break;
      case 'lap':
      case 'run':
        flash();
        entries.push(e.data);
        setTimer(e.data.time_fmt, 'done', mode === 'lap' ? 'last lap' : 'last run');
        if (mode === 'lap') { liveStart = Date.now(); startLive(2200); } else stopLive();
        renderAll();
        break;
    }
  });

  function refresh() {
    fetch('/api/state').then(r => r.json()).then(s => {
      mode = s.mode; armed = s.armed;
      entries = mode === 'lap' ? s.laps : s.runs;
      drivers = s.drivers; activeDriver = s.active_driver;
      document.getElementById('modeLap').classList.toggle('active', mode === 'lap');
      document.getElementById('modeAccel').classList.toggle('active', mode === 'accel');
      document.getElementById('sCountLabel').textContent = mode === 'lap' ? 'Laps' : 'Runs';
      document.getElementById('logTitle').textContent = mode === 'lap' ? 'Lap Log' : 'Run Log';
      document.getElementById('logSub').textContent = mode === 'lap' ? 'every lap, newest first' : 'every run, newest first';
      updateArm(); renderChips(); renderAll();
      setTimer('0:00.000','idle','waiting for first trigger');
    });
  }
  refresh();

  // ── controls ──
  function setMode(m){ fetch('/api/mode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:m})}); }
  function toggleArm(){ fetch(armed?'/api/disarm':'/api/arm',{method:'POST'}); }
  function resetSession(){ if(confirm('Reset session? All times cleared.')) fetch('/api/reset',{method:'POST'}); }
  function exportCSV(){ window.location.href = '/api/export'; }

  function addDriver(){
    const i = document.getElementById('driverInput');
    const name = i.value.trim();
    if(!name) return;
    fetch('/api/driver/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
    i.value=''; i.focus();
  }
  function selectDriver(n){ fetch('/api/driver/select',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})}); }
  function removeDriver(ev,n){ ev.stopPropagation(); fetch('/api/driver/remove',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})}); }

  // ── render ──
  function updateArm(){
    const b = document.getElementById('armBtn');
    b.textContent = armed ? 'Disarm' : 'Arm';
    b.classList.toggle('armed', armed);
  }

  function setConn(ok){
    document.getElementById('connDot').classList.toggle('on', ok);
    document.getElementById('connText').textContent = ok ? 'connected' : 'offline';
  }

  function renderChips(){
    const c = document.getElementById('chips');
    if(!drivers.length){ c.innerHTML = '<span class="chip-empty">none yet — laps log as Unassigned</span>'; return; }
    c.innerHTML = '';
    drivers.forEach(d => {
      const el = document.createElement('div');
      el.className = 'chip' + (d === activeDriver ? ' active' : '');
      el.onclick = () => selectDriver(d);
      el.innerHTML = `<span>${esc(d)}</span><span class="x" onclick="removeDriver(event,'${esc(d)}')">✕</span>`;
      c.appendChild(el);
    });
  }

  function setTimer(txt, cls, state){
    const t = document.getElementById('timer');
    t.textContent = txt;
    t.className = 'timer mono ' + cls;
    const hs = document.getElementById('heroState');
    hs.textContent = state;
    hs.classList.toggle('live', cls === 'live');
  }

  function startLive(delay){
    stopLive();
    const begin = () => {
      if(liveStart === null) return;
      liveTimer = setInterval(() => {
        setTimer(fmt((Date.now()-liveStart)/1000), 'live', mode==='lap'?'lap in progress':'run in progress');
      }, 40);
    };
    if(delay) setTimeout(begin, delay); else begin();
  }
  function stopLive(){ if(liveTimer){clearInterval(liveTimer); liveTimer=null;} liveStart=null; }

  function renderAll(){ renderStats(); renderLeaderboard(); renderLog(); }

  function renderStats(){
    const t = entries.map(e=>e.time_s);
    const set = (id,v)=>document.getElementById(id).textContent=v;
    if(!t.length){ set('sBest','—'); set('sLast','—'); set('sAvg','—'); set('sCount','0'); return; }
    set('sBest', fmt(Math.min(...t)));
    set('sLast', entries[entries.length-1].time_fmt);
    set('sAvg', fmt(t.reduce((a,b)=>a+b,0)/t.length));
    set('sCount', String(t.length));
  }

  function renderLeaderboard(){
    const box = document.getElementById('leaderboard');
    if(!entries.length){ box.innerHTML = '<div class="empty">No times yet.</div>'; return; }
    const best = {};
    entries.forEach(e => {
      const d = e.driver || 'Unassigned';
      if(!best[d] || e.time_s < best[d].time_s) best[d] = { time_s:e.time_s, time_fmt:e.time_fmt, count:0 };
    });
    entries.forEach(e => { const d = e.driver || 'Unassigned'; best[d].count++; });
    const ranked = Object.entries(best).sort((a,b)=>a[1].time_s-b[1].time_s);
    const unit = mode==='lap'?'laps':'runs';
    box.innerHTML = '';
    ranked.forEach(([name,info],i) => {
      const row = document.createElement('div');
      row.className = 'lb-row' + (i===0?' p1':'');
      row.innerHTML = `
        <div class="lb-rank">${i+1}</div>
        <div><div class="lb-name">${esc(name)}</div><div class="lb-meta">${info.count} ${unit}</div></div>
        <div class="lb-time">${info.time_fmt}</div>`;
      box.appendChild(row);
    });
  }

  function renderLog(){
    const box = document.getElementById('log');
    if(!entries.length){ box.innerHTML = '<div class="empty">Arm the sensor and send the car.</div>'; return; }
    const times = entries.map(e=>e.time_s);
    const best = Math.min(...times);
    const key = mode==='lap'?'lap':'run';
    box.innerHTML = '';
    entries.slice().reverse().forEach((e,i) => {
      const idx = entries.indexOf(e);
      const prev = entries[idx-1];
      let dStr='—', dCls='';
      if(prev){ const d=e.time_s-prev.time_s; dStr=(d>=0?'+':'')+d.toFixed(3); dCls=d>=0?'pos':'neg'; }
      const isBest = e.time_s===best && times.length>1;
      const row = document.createElement('div');
      row.className = 'log-row' + (i===0?' fresh':'');
      row.innerHTML = `
        <div class="log-num">#${e[key]}</div>
        <div class="log-driver">${esc(e.driver||'Unassigned')}</div>
        <div class="log-time ${isBest?'best':''}">${e.time_fmt}</div>
        <div class="log-delta ${dCls}">${dStr}</div>`;
      box.appendChild(row);
    });
  }

  function flash(){ const f=document.getElementById('flash'); f.classList.add('on'); setTimeout(()=>f.classList.remove('on'),150); }
  function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmt(s){ const m=Math.floor(s/60),ss=Math.floor(s%60),ms=Math.floor((s%1)*1000); return `${m}:${String(ss).padStart(2,'0')}.${String(ms).padStart(3,'0')}`; }
</script>
</body>
</html>
